name: Build 3012

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate localizations
        run: python3 scripts/validate_localizations.py

      - name: Test core package
        run: swift test --package-path Packages/ThreeZeroOneTwoCore --parallel

      - name: Build publishing tool
        run: swift build -c release --package-path Packages/ThreeZeroOneTwoCore --product 3012-publisher

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project 3012.xcodeproj \
            -scheme 3012 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataStandard" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Build unsigned Device Access app
        run: |
          set -o pipefail
          xcodebuild \
            -project 3012.xcodeproj \
            -scheme '3012 Device Access' \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataDeviceAccess" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedDataStandard/Build/Products/Release-iphoneos/3012.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/3012.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/3012-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/3012-unsigned.ipa"

      - name: Package unsigned Device Access IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedDataDeviceAccess/Build/Products/Release-iphoneos/3012-DeviceAccess.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa-device-access/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa-device-access/Payload/3012.app"
          cd "$RUNNER_TEMP/ipa-device-access"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/3012-DeviceAccess-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/3012-DeviceAccess-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: 3012-unsigned-${{ github.sha }}
          path: |
            3012-unsigned.ipa
            3012-DeviceAccess-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish immutable development release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedDataStandard/Build/Products/Release-iphoneos/3012.app"
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_TAG="build-v${APP_VERSION}.${GITHUB_RUN_NUMBER}"
          STANDARD_ASSET="3012-v${APP_VERSION}-build.${GITHUB_RUN_NUMBER}-unsigned.ipa"
          DEVICE_ASSET="3012-v${APP_VERSION}-build.${GITHUB_RUN_NUMBER}-DeviceAccess-unsigned.ipa"
          CHANGE=$(git log -1 --pretty=%s "$GITHUB_SHA")
          NOTES="Build ${GITHUB_RUN_NUMBER} from commit ${GITHUB_SHA}: ${CHANGE}. Both flavors use CFBundleIdentifier com.apple.mobile.MobileHouseArrest. Device Access must preserve the matching CodeDirectory identifier when signed. This release is retained so older builds remain downloadable."

          cp 3012-unsigned.ipa "$STANDARD_ASSET"
          cp 3012-DeviceAccess-unsigned.ipa "$DEVICE_ASSET"

          if gh release view "$BUILD_TAG" >/dev/null 2>&1; then
            gh release upload "$BUILD_TAG" "$STANDARD_ASSET" "$DEVICE_ASSET" --clobber
            gh release edit "$BUILD_TAG" \
              --title "3012 v${APP_VERSION} · Build ${GITHUB_RUN_NUMBER} (${SHORT_SHA})" \
              --notes "$NOTES" \
              --prerelease
          else
            gh release create "$BUILD_TAG" "$STANDARD_ASSET" "$DEVICE_ASSET" \
              --target "$GITHUB_SHA" \
              --title "3012 v${APP_VERSION} · Build ${GITHUB_RUN_NUMBER} (${SHORT_SHA})" \
              --notes "$NOTES" \
              --prerelease
          fi

      - name: Publish rolling development release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force dev-latest "$GITHUB_SHA"
          git push origin --force refs/tags/dev-latest

          NOTES="Automated unsigned development builds from commit ${GITHUB_SHA}. This rolling release always points to the newest successful main build; immutable build-v* releases retain older IPAs. Both flavors use CFBundleIdentifier com.apple.mobile.MobileHouseArrest. Device Access must also preserve the matching CodeDirectory identifier when signed; automatic identifier rewriting disables container access."
          if gh release view dev-latest >/dev/null 2>&1; then
            gh release upload dev-latest 3012-unsigned.ipa 3012-DeviceAccess-unsigned.ipa --clobber
            gh release edit dev-latest \
              --title "3012 Development Build" \
              --notes "$NOTES" \
              --prerelease=false \
              --latest
          else
            gh release create dev-latest 3012-unsigned.ipa 3012-DeviceAccess-unsigned.ipa \
              --verify-tag \
              --title "3012 Development Build" \
              --notes "$NOTES" \
              --latest
          fi

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXTRA_FLAGS=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            EXTRA_FLAGS+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" 3012-unsigned.ipa 3012-DeviceAccess-unsigned.ipa \
            --verify-tag \
            --generate-notes \
            --title "3012 $GITHUB_REF_NAME" \
            "${EXTRA_FLAGS[@]}"
