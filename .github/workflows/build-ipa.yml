name: Build 3012 Unsigned IPA

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'BuildServer/**'
      - '.github/workflows/build-server.yml'
      - '**.md'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'BuildServer/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA (3012)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode (16+)
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Using Xcode at: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Prepare Citadel Local Package for iOS 15.0+
        run: |
          rm -rf VendorPackages/Citadel
          mkdir -p VendorPackages
          git clone --depth 1 --branch 0.12.1 https://github.com/orlandos-nl/Citadel.git VendorPackages/Citadel
          rm -rf VendorPackages/Citadel/Package.resolved VendorPackages/Citadel/Examples VendorPackages/Citadel/Tests
          cat << 'EOF' > VendorPackages/Citadel/Package.swift
          // swift-tools-version:5.9
          import PackageDescription

          let package = Package(
              name: "Citadel",
              platforms: [
                  .macOS(.v14),
                  .iOS(.v15)
              ],
              products: [
                  .library(
                      name: "Citadel",
                      targets: ["Citadel"]
                  ),
              ],
              dependencies: [
                  .package(url: "https://github.com/Wellz26/swift-nio-ssh.git", "0.3.4" ..< "0.4.0"),
                  .package(url: "https://github.com/apple/swift-nio.git", from: "2.81.0"),
                  .package(url: "https://github.com/apple/swift-log.git", from: "1.6.0"),
                  .package(url: "https://github.com/attaswift/BigInt.git", from: "5.2.0"),
                  .package(url: "https://github.com/apple/swift-crypto.git", from: "3.12.3"),
              ],
              targets: [
                  .target(name: "CCitadelBcrypt"),
                  .target(
                      name: "Citadel",
                      dependencies: [
                          .target(name: "CCitadelBcrypt"),
                          .product(name: "NIOSSH", package: "swift-nio-ssh"),
                          .product(name: "NIO", package: "swift-nio"),
                          .product(name: "Crypto", package: "swift-crypto"),
                          .product(name: "_CryptoExtras", package: "swift-crypto"),
                          .product(name: "BigInt", package: "BigInt"),
                          .product(name: "Logging", package: "swift-log"),
                      ]
                  ),
              ]
          )
          EOF
          sed -i '' 's/Task\.sleep(for: \.seconds(100_000))/Task.sleep(nanoseconds: 100_000_000_000_000)/g' VendorPackages/Citadel/Sources/Citadel/RemotePortForward/Client/RemotePortForward+Client.swift
          sed -i '' 's/withDiscardingTaskGroup {/withTaskGroup(of: Void.self) {/g' VendorPackages/Citadel/Sources/Citadel/RemotePortForward/Client/RemotePortForward+Client.swift

      - name: Generate Xcode Project via XcodeGen
        run: xcodegen generate

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/SourcePackages
          key: ${{ runner.os }}-spm-ios15-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-ios15-
          save-always: true

      - name: Resolve Swift Package Dependencies
        run: xcodebuild -resolvePackageDependencies -project App3012.xcodeproj -scheme App3012 -clonedSourcePackagesDirPath build/SourcePackages

      - name: Build Release App (Unsigned)
        run: |
          xcodebuild build \
            -project App3012.xcodeproj \
            -scheme App3012 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -quiet \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned .ipa
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "3012.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: 3012.app not found!"
            ls -la build/Build/Products/Release-iphoneos || true
            exit 1
          fi
          echo "Verifying compiled Asset Catalog & AppIcon in Info.plist:"
          ls -lh "$APP_PATH/Assets.car"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" "$APP_PATH/Info.plist"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          codesign --force --deep --sign - --timestamp=none Payload/3012.app
          zip -qry 3012-Unsigned.ipa Payload
          ls -lh 3012-Unsigned.ipa

      - name: Upload 3012-Unsigned.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3012-Unsigned-IPA
          path: 3012-Unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish 3012-Unsigned.ipa to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VERSION=$(grep 'MARKETING_VERSION:' project.yml | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          TAG_NAME="v${APP_VERSION}-b${{ github.run_number }}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          IPA_SIZE=$(du -h 3012-Unsigned.ipa | cut -f1 | tr -d ' ')
          shasum -a 256 3012-Unsigned.ipa > SHA256SUMS.txt
          SHA256_VAL=$(cut -d ' ' -f1 SHA256SUMS.txt)

          cat <<EOF > RELEASE_NOTES.md
          ## 3012 Mobile IDE — v${APP_VERSION} (Build #${{ github.run_number }})

          Direct unsigned iOS/iPadOS application package ready for external certificate signing (\`.p12\` / \`.mobileprovision\` via Feather, ESign, AltStore, SideStore, Sideloadly, or TrollStore).

          | Property | Value |
          | :--- | :--- |
          | **Version** | \`${APP_VERSION}\` (Build \`#${{ github.run_number }}\`) |
          | **Bundle Identifier** | \`com.dev.app3012\` |
          | **Target Platform** | \`iOS 15.0+\` / \`iPadOS 15.0+\` (arm64 — TrollStore & Sideload Ready) |
          | **Package Size** | \`${IPA_SIZE}\` |
          | **Commit** | \`${SHORT_SHA}\` — ${COMMIT_MSG} |
          | **SHA-256** | \`${SHA256_VAL}\` |

          ### Direct Download
          - **[Download 3012-Unsigned.ipa](https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/3012-Unsigned.ipa)**
          EOF

          if gh release view "${TAG_NAME}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" 3012-Unsigned.ipa SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
          else
            gh release create "${TAG_NAME}" 3012-Unsigned.ipa SHA256SUMS.txt \
              --repo "${{ github.repository }}" \
              --title "3012 v${APP_VERSION} (Build #${{ github.run_number }})" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
