name: Build Server (Theos) Integration Test

on:
  push:
    branches: [ main ]
    paths:
      - 'BuildServer/**'
      - '.github/workflows/build-server.yml'
  pull_request:
    paths:
      - 'BuildServer/**'
  workflow_dispatch:

jobs:
  integration:
    name: Docker image + API end-to-end build (Ubuntu x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Theos builder image
        run: docker build -t 3012-theos-builder:latest BuildServer/image

      - name: Start build server
        run: |
          mkdir -p "$RUNNER_TEMP/build-data"
          BUILD_DATA_DIR="$RUNNER_TEMP/build-data" BUILD_CONCURRENCY=2 BUILD_TIMEOUT_SEC=300 \
            nohup python3 BuildServer/server/build_server.py > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8787/v1/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8787/v1/health

      - name: Submit sample tweak & wait for result
        run: |
          set -euo pipefail
          DEVICE="ci-$(uuidgen)"
          (cd BuildServer/samples && zip -qr "$RUNNER_TEMP/hello.zip" HelloTweak)
          RESP=$(curl -fsS -X POST http://127.0.0.1:8787/v1/builds \
                   -H "Content-Type: application/zip" -H "X-Device-ID: $DEVICE" \
                   -H "X-Package-Scheme: rootless" --data-binary "@$RUNNER_TEMP/hello.zip")
          echo "$RESP"
          ID=$(echo "$RESP" | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          OFFSET=0
          for i in $(seq 1 300); do
            S=$(curl -fsS -H "X-Device-ID: $DEVICE" "http://127.0.0.1:8787/v1/builds/$ID?since=$OFFSET")
            echo "$S" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["log"],end="")'
            OFFSET=$(echo "$S" | python3 -c 'import sys,json;print(json.load(sys.stdin)["logOffset"])')
            STATE=$(echo "$S" | python3 -c 'import sys,json;print(json.load(sys.stdin)["state"])')
            if [ "$STATE" != "queued" ] && [ "$STATE" != "running" ]; then break; fi
            sleep 1
          done
          echo "Final state: $STATE"
          echo "$S" | python3 -c 'import sys,json;d=json.load(sys.stdin);print("files:",d["files"])'
          [ "$STATE" = "succeeded" ]
          DEB=$(echo "$S" | python3 -c 'import sys,json;print([f["name"] for f in json.load(sys.stdin)["files"] if f["name"].endswith(".deb")][0])')
          DYLIB=$(echo "$S" | python3 -c 'import sys,json;print([f["name"] for f in json.load(sys.stdin)["files"] if f["name"].endswith(".dylib")][0])')
          curl -fsS -H "X-Device-ID: $DEVICE" -o "$RUNNER_TEMP/$DEB" "http://127.0.0.1:8787/v1/builds/$ID/files/$DEB"
          curl -fsS -H "X-Device-ID: $DEVICE" -o "$RUNNER_TEMP/$DYLIB" "http://127.0.0.1:8787/v1/builds/$ID/files/$DYLIB"
          test -s "$RUNNER_TEMP/$DYLIB"
          dpkg-deb -I "$RUNNER_TEMP/$DEB"
          dpkg-deb -c "$RUNNER_TEMP/$DEB"
          # Download must be refused for other devices
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "X-Device-ID: someone-else-1234" "http://127.0.0.1:8787/v1/builds/$ID/files/$DEB")
          [ "$CODE" = "403" ]

      - name: Test CAS Chunked Upload & Incremental .theos Rebuild
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, struct, sys, time, traceback, urllib.error, urllib.request

          def _ci_excepthook(exc_type, exc, tb):
              msg = "".join(traceback.format_exception(exc_type, exc, tb))[-3500:]
              esc = msg.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error::{esc}", flush=True)
              sys.__excepthook__(exc_type, exc, tb)

          sys.excepthook = _ci_excepthook

          BASE = "http://127.0.0.1:8787"
          DEVICE = "ci-cas-device-12345678"

          def post_json(path, obj, expected=(200, 202)):
              data = json.dumps(obj).encode("utf-8")
              req = urllib.request.Request(
                  BASE + path,
                  data=data,
                  headers={
                      "Content-Type": "application/json",
                      "X-Device-ID": DEVICE,
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      assert r.status in expected, (r.status, path)
                      return json.loads(r.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  raise AssertionError(f"POST {path} HTTP {e.code}: {body}")

          def upload_chunks(items):
              # items: list[(sha_hex, bytes)]
              buf = bytearray(b"3012CAS1")
              buf.extend(struct.pack("!I", len(items)))
              for sha_hex, raw in items:
                  buf.extend(bytes.fromhex(sha_hex))
                  buf.extend(struct.pack("!I", len(raw)))
                  buf.extend(raw)
              req = urllib.request.Request(
                  BASE + "/v1/cas/upload",
                  data=bytes(buf),
                  headers={
                      "Content-Type": "application/octet-stream",
                      "X-Device-ID": DEVICE,
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  assert r.status == 200
                  return json.loads(r.read().decode("utf-8"))

          def poll_job(job_id):
              offset = 0
              full_log = []
              for _ in range(240):
                  req = urllib.request.Request(
                      f"{BASE}/v1/builds/{job_id}?since={offset}",
                      headers={"X-Device-ID": DEVICE},
                  )
                  with urllib.request.urlopen(req, timeout=15) as r:
                      st = json.loads(r.read().decode("utf-8"))
                  if st.get("log"):
                      print(st["log"], end="")
                      full_log.append(st["log"])
                  offset = st.get("logOffset", offset)
                  if st["state"] not in ("queued", "running"):
                      return st, "".join(full_log)
                  time.sleep(0.5)
              raise AssertionError("CAS build timeout")

          makefile = (
              "ARCHS = arm64\n"
              "TARGET := iphone:clang:latest:15.0\n"
              "include $(THEOS)/makefiles/common.mk\n"
              "TWEAK_NAME = CasTest\n"
              "CasTest_FILES = Tweak.x Helper.c\n"
              "include $(THEOS_MAKE_PATH)/tweak.mk\n"
          ).encode("utf-8")
          control = (
              "Package: com.dev.castest\n"
              "Name: CasTest\n"
              "Version: 1.0.0\n"
              "Architecture: iphoneos-arm64\n"
              "Description: CAS delta test tweak\n"
              "Maintainer: CI\n"
              "Author: CI\n"
              "Section: Tweaks\n"
          ).encode("utf-8")
          plist = (
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<plist version="1.0"><dict><key>Filter</key><dict><key>Bundles</key>'
              '<array><string>com.apple.springboard</string></array></dict></dict></plist>\n'
          ).encode("utf-8")
          helper_c = b"int cas_helper_value(void) { return 42; }\n"
          tweak_v1 = (
              "#import <Foundation/Foundation.h>\n"
              "extern int cas_helper_value(void);\n"
              "%ctor { NSLog(@\"CAS_V1=%d\", cas_helper_value()); }\n"
          ).encode("utf-8")
          big_asset = b"CASASSET" * (256 * 1024)  # 2 MiB asset inside layout/

          files_v1 = {
              "Makefile": makefile,
              "control": control,
              "CasTest.plist": plist,
              "Helper.c": helper_c,
              "Tweak.x": tweak_v1,
              "layout/Library/CasTest/asset.bin": big_asset,
              "empty.txt": b"",
          }

          hashes = {}
          for p, b in files_v1.items():
              if b:
                  hashes[p] = hashlib.sha256(b).hexdigest()

          chk1 = post_json("/v1/cas/check", {"hashes": list(hashes.values())})
          assert chk1["maxProjectMB"] >= 300, chk1
          assert set(chk1["missing"]) == set(hashes.values()), chk1

          by_sha = {sha: raw for p, raw in files_v1.items() if raw for sha in [hashes[p]]}
          up1 = upload_chunks(list(by_sha.items()))
          assert up1["stored"] == len(by_sha), up1

          manifest1 = {
              "projectName": "CasTestProj",
              "scheme": "rootless",
              "clean": False,
              "files": [
                  {"path": p, "size": len(b), "chunks": [hashes[p]] if b else [], "exec": False}
                  for p, b in files_v1.items()
              ],
          }
          job1 = post_json("/v1/builds/cas", manifest1)
          st1, log1 = poll_job(job1["id"])
          assert st1["state"] == "succeeded", (st1, log1)
          assert "Helper.c" in log1 and "Tweak.x" in log1, log1
          assert any(f["name"].endswith(".deb") for f in st1["files"]), st1["files"]

          # Build 2: modify ONLY Tweak.x and verify Helper.c + 2 MiB asset stay cached!
          tweak_v2 = tweak_v1.replace(b"CAS_V1", b"CAS_V2")
          files_v2 = dict(files_v1)
          files_v2["Tweak.x"] = tweak_v2
          hashes2 = {p: hashlib.sha256(b).hexdigest() for p, b in files_v2.items() if b}

          chk2 = post_json("/v1/cas/check", {"hashes": list(hashes2.values())})
          assert chk2["missing"] == [hashes2["Tweak.x"]], chk2
          upload_chunks([(hashes2["Tweak.x"], tweak_v2)])

          manifest2 = {
              "projectName": "CasTestProj",
              "scheme": "rootless",
              "clean": False,
              "files": [
                  {"path": p, "size": len(b), "chunks": [hashes2[p]] if b else [], "exec": False}
                  for p, b in files_v2.items()
              ],
          }
          job2 = post_json("/v1/builds/cas", manifest2)
          st2, log2 = poll_job(job2["id"])
          assert st2["state"] == "succeeded", (st2, log2)
          assert "Compiling Tweak.x" in log2, log2
          assert "Compiling Helper.c" not in log2, "Expected Helper.c object to be reused from .theos cache!\n" + log2
          print("CAS incremental delta + .theos cache verified OK!")

          # Build 3: Broken macOS Makefile (hardcoded /Users/0211/theos, CRLF, missing TARGET, missing control)
          broken_makefile = (
              "export THEOS=/Users/0211/theos\r\n"
              "ARCHS = arm64\r\n"
              "\r\n"
              "DEBUG = 0\r\n"
              "FINALPACKAGE = 1\r\n"
              "FOR_RELEASE = 1\r\n"
              "\r\n"
              "include $(THEOS)/makefiles/common.mk\r\n"
              "\r\n"
              "TWEAK_NAME = Alert\r\n"
              "$(TWEAK_NAME)_FRAMEWORKS = UIKit\r\n"
              "$(TWEAK_NAME)_CCFLAGS = -std=c++11 -fno-rtti -fno-exceptions -DNDEBUG\r\n"
              "$(TWEAK_NAME)_CFLAGS = -fobjc-arc\r\n"
              "$(TWEAK_NAME)_FILES = Alert.mm\r\n"
              "\r\n"
              "include $(THEOS_MAKE_PATH)/tweak.mk\r\n"
          ).encode("utf-8")
          alert_mm = (
              "#import <UIKit/UIKit.h>\n"
              "__attribute__((constructor)) static void AlertInit(void) {\n"
              "    Class cls = [UIAlertController class];\n"
              "    (void)cls;\n"
              "}\n"
          ).encode("utf-8")
          files_v3 = {"Makefile": broken_makefile, "Alert.mm": alert_mm}
          hashes3 = {p: hashlib.sha256(b).hexdigest() for p, b in files_v3.items()}
          chk3 = post_json("/v1/cas/check", {"hashes": list(hashes3.values())})
          if chk3["missing"]:
              up3 = upload_chunks([(hashes3[p], files_v3[p]) for p in files_v3 if hashes3[p] in set(chk3["missing"])])
              assert up3["stored"] >= 1, up3
          job3 = post_json("/v1/builds/cas", {
              "projectName": "AlertBrokenMakefile",
              "scheme": "rootless",
              "clean": False,
              "files": [{"path": p, "size": len(b), "chunks": [hashes3[p]], "exec": False} for p, b in files_v3.items()],
          })
          st3, log3 = poll_job(job3["id"])
          assert st3["state"] == "succeeded", (st3, log3)
          names3 = [f["name"] for f in st3["files"]]
          assert any(n.endswith(".deb") for n in names3) and "Alert.dylib" in names3, (names3, log3)
          print("Broken macOS Makefile auto-heal verified OK:", names3)
          PY

      - name: Verify /sync.mjs & Zero-Knowledge WebSocket Relay (/v1/sync)
        run: |
          set -euo pipefail
          curl -fsS "http://127.0.0.1:8787/sync.mjs" -o "$RUNNER_TEMP/sync.mjs"
          node --check "$RUNNER_TEMP/sync.mjs"
          python3 - <<'PY'
          import base64, hashlib, json, os, socket, struct

          def ws_connect(role: str, cid: str):
              s = socket.create_connection(("127.0.0.1", 8787), timeout=10)
              ws_key = base64.b64encode(os.urandom(16)).decode("ascii")
              req = (
                  "GET /v1/sync HTTP/1.1\r\n"
                  "Host: 127.0.0.1:8787\r\n"
                  "Upgrade: websocket\r\n"
                  "Connection: Upgrade\r\n"
                  f"Sec-WebSocket-Key: {ws_key}\r\n"
                  "Sec-WebSocket-Version: 13\r\n\r\n"
              ).encode("ascii")
              s.sendall(req)
              buf = b""
              while b"\r\n\r\n" not in buf:
                  buf += s.recv(4096)
              header, rest = buf.split(b"\r\n\r\n", 1)
              assert b"101 Switching Protocols" in header, header
              expected = base64.b64encode(
                  hashlib.sha1((ws_key + "258EAFA5-E914-47DA-95CA-C5AB0DC85B11").encode()).digest()
              ).decode("ascii")
              assert expected.encode("ascii") in header
              state = {"buf": bytearray(rest)}

              def recv_exact(n: int) -> bytes:
                  while len(state["buf"]) < n:
                      chunk = s.recv(4096)
                      assert chunk, "EOF"
                      state["buf"].extend(chunk)
                  out = bytes(state["buf"][:n])
                  del state["buf"][:n]
                  return out

              def send_json(obj: dict) -> None:
                  payload = json.dumps(obj).encode("utf-8")
                  mask = os.urandom(4)
                  header_bytes = bytearray([0x81])
                  length = len(payload)
                  if length < 126:
                      header_bytes.append(0x80 | length)
                  elif length < 65536:
                      header_bytes.append(0x80 | 126)
                      header_bytes.extend(struct.pack("!H", length))
                  else:
                      header_bytes.append(0x80 | 127)
                      header_bytes.extend(struct.pack("!Q", length))
                  header_bytes.extend(mask)
                  masked = bytes(payload[i] ^ mask[i % 4] for i in range(length))
                  s.sendall(bytes(header_bytes) + masked)

              def recv_json() -> dict:
                  while True:
                      b1, b2 = recv_exact(2)
                      opcode = b1 & 0x0F
                      length = b2 & 0x7F
                      if length == 126:
                          length = struct.unpack("!H", recv_exact(2))[0]
                      elif length == 127:
                          length = struct.unpack("!Q", recv_exact(8))[0]
                      if b2 & 0x80:
                          m = recv_exact(4)
                          raw = recv_exact(length)
                          data = bytes(raw[i] ^ m[i % 4] for i in range(length))
                      else:
                          data = recv_exact(length)
                      if opcode == 0x9:
                          continue
                      if opcode == 0x8:
                          raise EOFError("closed")
                      return json.loads(data.decode("utf-8"))

              send_json({"type": "relay_join", "role": role, "clientId": cid, "key": "482910"})
              joined = recv_json()
              assert joined["type"] == "relay_joined", joined
              return s, send_json, recv_json, joined

          pc_s, pc_send, pc_recv, pc_joined = ws_connect("pc", "pc-test-1")
          mob_s, mob_send, mob_recv, mob_joined = ws_connect("mobile", "mob-test-1")
          assert len(mob_joined["peers"]) == 1 and mob_joined["peers"][0]["clientId"] == "pc-test-1"
          peer_evt = pc_recv()
          assert peer_evt["type"] == "relay_peer_joined" and peer_evt["role"] == "mobile", peer_evt

          pc_send({"type": "relay_ping", "ts": 12345})
          pong = pc_recv()
          assert pong["type"] == "relay_pong" and pong["ts"] == 12345, pong

          pc_send({"type": "relay_packet", "p": "dGVzdC1lMmVlLWJsb2I="})
          relayed_to_mob = mob_recv()
          assert relayed_to_mob["type"] == "relay_packet" and relayed_to_mob["p"] == "dGVzdC1lMmVlLWJsb2I=", relayed_to_mob

          mob_send({"type": "relay_packet", "p": "cmVwbHktZnJvbS1tb2JpbGU="})
          relayed_to_pc = pc_recv()
          assert relayed_to_pc["type"] == "relay_packet" and relayed_to_pc["p"] == "cmVwbHktZnJvbS1tb2JpbGU=", relayed_to_pc

          pc_s.close()
          mob_s.close()
          print("WebSocket relay E2E OK")
          PY

      - name: Sandbox checks (no network, read-only, unprivileged)
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/probe.sh" <<'EOF'
          id -u
          (curl -m 5 -sS https://example.com >/dev/null && echo NET_OK) || echo NET_BLOCKED
          (touch /opt/theos/x 2>/dev/null && echo RO_FAIL) || echo RO_OK
          EOF
          OUT=$(docker run --rm -i --network none --read-only --tmpfs /work:rw,exec,size=64m,uid=1000,gid=1000 \
                  --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges \
                  --entrypoint /bin/bash 3012-theos-builder:latest < "$RUNNER_TEMP/probe.sh")
          echo "$OUT"
          echo "$OUT" | grep -q '^1000$'
          echo "$OUT" | grep -q NET_BLOCKED
          echo "$OUT" | grep -q RO_OK

      - name: Server log
        if: always()
        run: cat "$RUNNER_TEMP/server.log" || true
