name: App3012
options:
  bundleIdPrefix: com.dev
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  Runestone:
    url: https://github.com/simonbs/Runestone
    revision: 00426ba7f8681a90c1ea0b5c03a0e0bec8cba883
  TreeSitterLanguages:
    url: https://github.com/simonbs/TreeSitterLanguages
    revision: 4442182303a00bf2764b10ead923a1066a0946f6
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    minVersion: 1.11.2
    maxVersion: 1.13.99
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    from: 0.12.1
  SwiftNIO:
    url: https://github.com/apple/swift-nio.git
    from: 2.81.0
  SwiftNIOSSH:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    minVersion: 0.3.4
    maxVersion: 0.3.99
  SwiftCrypto:
    url: https://github.com/apple/swift-crypto.git
    from: 3.12.3
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.20

targets:
  App3012:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: "3012"
        PRODUCT_MODULE_NAME: App3012
        PRODUCT_BUNDLE_IDENTIFIER: com.dev.app3012
        MARKETING_VERSION: "3.1.0"
        CURRENT_PROJECT_VERSION: "5"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "3012"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    info:
      path: Config/Info.plist
      properties:
        CFBundleName: "3012"
        CFBundleDisplayName: "3012"
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundlePackageType: APPL
        CFBundleExecutable: $(EXECUTABLE_NAME)
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    dependencies:
      - package: Runestone
        product: Runestone
      - package: TreeSitterLanguages
        product: TreeSitterAstroRunestone
      - package: TreeSitterLanguages
        product: TreeSitterBashRunestone
      - package: TreeSitterLanguages
        product: TreeSitterBicepRunestone
      - package: TreeSitterLanguages
        product: TreeSitterCMakeRunestone
      - package: TreeSitterLanguages
        product: TreeSitterCPPRunestone
      - package: TreeSitterLanguages
        product: TreeSitterCRunestone
      - package: TreeSitterLanguages
        product: TreeSitterCSharpRunestone
      - package: TreeSitterLanguages
        product: TreeSitterCSSRunestone
      - package: TreeSitterLanguages
        product: TreeSitterDartRunestone
      - package: TreeSitterLanguages
        product: TreeSitterDiffRunestone
      - package: TreeSitterLanguages
        product: TreeSitterElixirRunestone
      - package: TreeSitterLanguages
        product: TreeSitterElmRunestone
      - package: TreeSitterLanguages
        product: TreeSitterFishRunestone
      - package: TreeSitterLanguages
        product: TreeSitterGoRunestone
      - package: TreeSitterLanguages
        product: TreeSitterHCLRunestone
      - package: TreeSitterLanguages
        product: TreeSitterHTMLRunestone
      - package: TreeSitterLanguages
